function buildHistoryFromRows(wrows,crows){
  var byDate={};
  wrows.forEach(function(row){
    if(!byDate[row.date])byDate[row.date]=[];
    byDate[row.date].push(row);
  });
  var sessions=[];
  Object.keys(byDate).sort().reverse().forEach(function(date){
    var rows=byDate[date];
    var dayOverride=rows[0].day_override;
    var dIdx=(dayOverride!==null&&dayOverride!==undefined)?dayOverride:getDayIdx(date);
    var workout=WORKOUTS[dIdx];if(!workout)return;
    var log={};
    rows.forEach(function(row){
      var ei=row.exercise_idx;var si=row.set_idx;
      if(row.weight!==null&&row.weight!==undefined)log[ei+"-"+si+"-w"]=row.weight;
      if(row.reps!==null&&row.reps!==undefined)log[ei+"-"+si+"-r"]=row.reps;
      if(row.is_done)log[ei+"-"+si+"-done"]=true;
    });
    var exerciseData=[];var totalVolume=0;var setsCompleted=0;
    workout.exercises.forEach(function(ex,eIdx){
      var sets=[];
      for(var sIdx=0;sIdx<(ex.sets||3);sIdx++){
        var w=parseFloat(log[eIdx+"-"+sIdx+"-w"])||0;
        var r=parseFloat(log[eIdx+"-"+sIdx+"-r"])||0;
        var done=!!log[eIdx+"-"+sIdx+"-done"];
        if(w>0||r>0||done){sets.push({set:sIdx+1,weight:w,reps:r,done:done,volume:w*r});totalVolume+=w*r;if(done)setsCompleted++;}
      }
      if(sets.length>0){var best=sets.reduce(function(a,b){return a.weight>b.weight?a:b},sets[0]);exerciseData.push({name:ex.name,sets:sets,bestWeight:best.weight,bestReps:best.reps});}
    });
    if(exerciseData.length>0)sessions.push({date:date,dayName:DAYNAMES[dIdx],dayIdx:dIdx,workoutName:workout.name,exercises:exerciseData,totalVolume:totalVolume,setsCompleted:setsCompleted});
  });
  var prs={};
  sessions.forEach(function(sess){
    sess.exercises.forEach(function(ex){
      if(!prs[ex.name]||ex.bestWeight>prs[ex.name].weight)prs[ex.name]={weight:ex.bestWeight,reps:ex.bestReps,date:sess.date};
    });
  });
  var byCheckDate={};
  crows.forEach(function(row){if(!byCheckDate[row.date])byCheckDate[row.date]=[];byCheckDate[row.date].push(row);});
  var checkHistory=[];var currentStreak=0;var longestStreak=0;var tempStreak=0;
  Object.keys(byCheckDate).sort().forEach(function(date){
    var rows=byCheckDate[date];
    var completed=rows.filter(function(r){return r.is_done;}).length;
    var pct=Math.round((completed/CHECKLIST.length)*100);
    checkHistory.push({date:date,completed:completed,total:CHECKLIST.length,pct:pct});
    if(pct>=75){tempStreak++;if(tempStreak>longestStreak)longestStreak=tempStreak;}else tempStreak=0;
  });
  currentStreak=tempStreak;
  var weeklyVolume=[];var now=new Date();
  for(var wi=0;wi<8;wi++){
    var wEnd=new Date(now);wEnd.setDate(now.getDate()-wi*7);
    var wStart=new Date(wEnd);wStart.setDate(wEnd.getDate()-6);
    var ws=wStart.toISOString().split("T")[0];var we=wEnd.toISOString().split("T")[0];
    var vol=0;var days=0;
    sessions.forEach(function(s){if(s.date>=ws&&s.date<=we){vol+=s.totalVolume;days++;}});
    weeklyVolume.push({weekLabel:"W-"+wi,volume:vol,days:days});
  }
  weeklyVolume.reverse();
  var todayObj=new Date(getToday()+"T12:00:00");
  var dow=todayObj.getDay();var diffToMon=(dow===0?-6:1-dow);
  var weekMon=new Date(todayObj);weekMon.setDate(todayObj.getDate()+diffToMon);
  var weekMonStr=weekMon.toISOString().split("T")[0];
  var weeklyMuscles={};
  Object.keys(MUSCLE_TARGETS).forEach(function(m){weeklyMuscles[m]=0;});
  var weeklyHeads={};
  Object.keys(MUSCLE_HEAD_TARGETS).forEach(function(m){weeklyHeads[m]=0;});
  Object.keys(byDate).forEach(function(date){
    if(date<weekMonStr)return;
    var rows=byDate[date];var dayOverride=rows[0].day_override;
    var dIdx=(dayOverride!==null&&dayOverride!==undefined)?dayOverride:getDayIdx(date);
    var wo=WORKOUTS[dIdx];if(!wo)return;
    rows.forEach(function(row){
      if(!row.is_done)return;
      var ex=wo.exercises[row.exercise_idx];
      if(!ex)return;
      var dbRow=gExerciseDB&&ex.exercise_id?gExerciseDB[ex.exercise_id]:null;
      if(dbRow){
        if(Array.isArray(dbRow.muscles)){
          var groups=new Set();
          dbRow.muscles.forEach(function(entry){
            if(entry.weight>=0.5){
              var g=MUSCLE_HEAD_TO_GROUP[entry.muscle_id];if(g)groups.add(g);
              if(weeklyHeads.hasOwnProperty(entry.muscle_id))weeklyHeads[entry.muscle_id]++;
            }
          });
          groups.forEach(function(g){weeklyMuscles[g]++;});
        }
      } else {
        if(ex.muscles){ex.muscles.forEach(function(m){if(weeklyMuscles.hasOwnProperty(m))weeklyMuscles[m]++;});}
      }
    });
  });
  return{sessions:sessions,prs:prs,checkHistory:checkHistory.reverse(),currentStreak:currentStreak,longestStreak:longestStreak,weeklyVolume:weeklyVolume,weeklyMuscles:weeklyMuscles,weeklyHeads:weeklyHeads};
}

function loadExerciseDB(){
  sb.from("exercises").select("exercise_id,name,aliases,domain,movement_pattern_primary,movement_pattern_secondary,loading_type,muscles,head_emphasis_notes,equipment_primary,equipment_specific,training_modality,default_role,session_position,loaded_position,demands,verified").then(function(r){
    if(r.error||!r.data){console.warn("[muscle-rollup] exercises fetch failed, using hardcoded fallback",r.error);return;}
    var map={};
    r.data.forEach(function(row){map[row.exercise_id]=row;});
    gExerciseDB=map;
  });
}

function getGhostFromHistory(sessions,todayDate){
  if(!sessions)return null;
  var todayDayIdx=getDayIdx(todayDate);
  var workout=WORKOUTS[todayDayIdx];if(!workout)return null;
  for(var i=0;i<sessions.length;i++){
    var sess=sessions[i];
    if(sess.date===todayDate)continue;
    if(sess.dayIdx!==todayDayIdx)continue;
    var ghost={date:sess.date,exercises:{}};
    sess.exercises.forEach(function(ex){
      var exIdx=-1;
      for(var j=0;j<workout.exercises.length;j++){if(workout.exercises[j].name===ex.name){exIdx=j;break;}}
      if(exIdx>=0&&ex.sets.length>0){
        ghost.exercises[exIdx]={sets:ex.sets.map(function(s){return{weight:s.weight,reps:s.reps,set:s.set};}),best:ex.sets.reduce(function(a,b){return a.weight>b.weight?a:b},ex.sets[0])};
      }
    });
    if(Object.keys(ghost.exercises).length>0)return ghost;
  }
  return null;
}

function WeightLineChart(entries){
  if(!entries||entries.length<2)return null;
  var sorted=entries.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var W=340,H=130,pl=36,pr=10,pt=12,pb=26;
  var iW=W-pl-pr,iH=H-pt-pb;
  var weights=sorted.map(function(e){return parseFloat(e.weight);});
  var minW=Math.min.apply(null,weights),maxW=Math.max.apply(null,weights);
  var range=maxW-minW||1;
  var n=sorted.length;
  function xp(i){return pl+(i/(n-1))*iW;}
  function yp(w){return pt+(1-(w-minW)/range)*iH;}
  var linePath="M "+sorted.map(function(e,i){return xp(i).toFixed(1)+" "+yp(e.weight).toFixed(1);}).join(" L ");
  var areaPath=linePath+" L "+xp(n-1).toFixed(1)+" "+(pt+iH)+" L "+pl+" "+(pt+iH)+" Z";
  var xLabels=[0,Math.floor((n-1)/2),n-1].filter(function(v,i,a){return a.indexOf(v)===i;});
  return h("svg",{width:"100%",viewBox:"0 0 "+W+" "+H,style:{overflow:"visible",display:"block"}},
    h("path",{d:areaPath,fill:C.teal+"1a",stroke:"none"}),
    h("path",{d:linePath,fill:"none",stroke:C.teal,strokeWidth:"2",strokeLinejoin:"round"}),
    sorted.map(function(e,i){return h("circle",{key:i,cx:xp(i),cy:yp(e.weight),r:"3",fill:C.teal});}),
    h("text",{x:pl-4,y:pt+5,textAnchor:"end",fill:C.dim,fontSize:"8",fontFamily:"Courier New"},(maxW%1===0?maxW:maxW.toFixed(1))),
    h("text",{x:pl-4,y:pt+iH,textAnchor:"end",fill:C.dim,fontSize:"8",fontFamily:"Courier New"},(minW%1===0?minW:minW.toFixed(1))),
    xLabels.map(function(i){return h("text",{key:i,x:xp(i),y:H-4,textAnchor:"middle",fill:C.dim,fontSize:"7",fontFamily:"Courier New"},fmtDate(sorted[i].date));})
  );
}

function BarChart(props){
  var data=props.data,labelKey=props.labelKey,valueKey=props.valueKey,color=props.color,ht=props.height||120;
  var max=Math.max.apply(null,data.map(function(d){return d[valueKey]}));

    h("div",{style:{display:"flex",alignItems:"flex-end",gap:4,height:ht,padding:"0 4px",minWidth:data.length*32}},
      data.map(function(d,i){

          h("div",{style:{fontSize:9,color:C.dim,textAlign:"center"}},d[valueKey]>0?(d[valueKey]>=1000?Math.round(d[valueKey]/1000)+"k":d[valueKey]):""),

          ),

        );
      })
    )
  );
}

// Returns the flat UI group (MUSCLE_TARGETS key) with the highest summed weight
// across the exercise's muscles array (only weight >= 0.5 entries count).
function getPrimaryMuscleGroup(muscles){
  var totals={};
  (muscles||[]).forEach(function(m){
    if(m.weight>=0.5){var g=MUSCLE_HEAD_TO_GROUP[m.muscle_id];if(g)totals[g]=(totals[g]||0)+m.weight;}
  });
  var best=null,bestVal=0;
  Object.keys(totals).forEach(function(g){if(totals[g]>bestVal){bestVal=totals[g];best=g;}});
  return best;
}

// Returns all flat UI groups that appear at weight >= 0.5 in the muscles array.
function getMuscleGroupsForExercise(muscles){
  var groups={};
  (muscles||[]).forEach(function(m){
    if(m.weight>=0.5){var g=MUSCLE_HEAD_TO_GROUP[m.muscle_id];if(g)groups[g]=true;}
  });
  return Object.keys(groups);
}

function OnboardingWizard(props){

  var nameArr=useState("");var name=nameArr[0];var setName=nameArr[1];

  var expArr=useState("");var exp=expArr[0];var setExp=expArr[1];
  var gymArr=useState("");var gym=gymArr[0];var setGym=gymArr[1];
  var calArr=useState(2800);var cal=calArr[0];var setCal=calArr[1];
  var protArr=useState(200);var prot=protArr[0];var setProt=protArr[1];
  var carbArr=useState(300);var carb=carbArr[0];var setCarb=carbArr[1];
  var fatArr=useState(80);var fat=fatArr[0];var setFat=fatArr[1];

  function callClaudeVision(b64,mode){
    if(!profile||!profile.anthropic_api_key){setPendingScan({b64:b64,mode:mode});setApiKeyError(null);setApiKeyInput("");setApiKeyVisible(false);setApiKeyModal(true);return;}
    setNutLoading(true);
    sb.functions.invoke("claude-vision",{body:{b64:b64,mode:mode}}).then(function(r){
      setNutLoading(false);
      if(r.error){toast("Scan error: "+r.error.message,"error");return;}
      var data=r.data;
      if(data&&data.error){
        if(data.error.type==="authentication_error"){
          setProfile(function(p){return Object.assign({},p,{anthropic_api_key:null});});
          sb.from("profiles").update({anthropic_api_key:null}).eq("id",user.id);
          setPendingScan({b64:b64,mode:mode});
          setApiKeyError("Invalid API key — please enter a new one");
          setApiKeyInput("");setApiKeyVisible(false);setApiKeyModal(true);
        }else if(data.error.type==="no_api_key"){
          setPendingScan({b64:b64,mode:mode});
          setApiKeyError(null);setApiKeyInput("");setApiKeyVisible(false);setApiKeyModal(true);
        }else{toast("Claude error: "+(data.error.message||"Unknown error"),"error");}
        return;
      }
      var text=data&&data.content&&data.content[0]&&data.content[0].text;
      if(!text){toast("No response from Claude. Try again.","error");return;}
      try{
        setNutScan({mode:mode,base64:b64,result:JSON.parse(text.trim()),portionMult:1.0});
      }catch(e){
        var match=text.match(/\{[\s\S]*?\}/);
        if(match){try{setNutScan({mode:mode,base64:b64,result:JSON.parse(match[0]),portionMult:1.0});return;}catch(e2){}}
        toast("Could not parse response. Try again.","error");
      }
    }).catch(function(e){setNutLoading(false);toast("Scan failed: "+e.message,"error");});
  }

  function doMigration(){
    setMigrating(true);
    var keys=LS.keys();var checkInserts=[];var wlogInserts=[];
    keys.forEach(function(k){
      if(k.indexOf("checks-")===0){
        var date=k.replace("checks-","");var data=LS.get(k);
        if(data)Object.keys(data).forEach(function(taskId){checkInserts.push({user_id:user.id,date:date,task_id:taskId,is_done:!!data[taskId]});});
      }else if(k.match(/^wlog-\d+-\d{4}-/)){
        var parts=k.replace("wlog-","");var di=parts.indexOf("-");
        var dayOv=parseInt(parts.slice(0,di));var date2=parts.slice(di+1);
        var data2=LS.get(k);
        if(data2){
          var processed={};
          Object.keys(data2).forEach(function(key){
            var kparts=key.split("-");if(kparts.length<3)return;
            var ei=parseInt(kparts[0]);var si=parseInt(kparts[1]);var field=kparts[2];
            var rk=ei+"-"+si;
            if(!processed[rk])processed[rk]={user_id:user.id,date:date2,day_override:dayOv,exercise_idx:ei,set_idx:si,is_done:false};
            if(field==="w")processed[rk].weight=parseFloat(data2[key])||null;
            else if(field==="r")processed[rk].reps=parseInt(data2[key])||null;
            else if(field==="done")processed[rk].is_done=!!data2[key];
          });
          Object.keys(processed).forEach(function(rk){wlogInserts.push(processed[rk]);});
        }
      }
    });
    var cycleStartVal=LS.get("cycle-start");
    Promise.all([
      checkInserts.length>0?sb.from("checklist_completions").upsert(checkInserts,{onConflict:"user_id,date,task_id"}):Promise.resolve(),
      wlogInserts.length>0?sb.from("workout_logs").upsert(wlogInserts,{onConflict:"user_id,date,exercise_idx,set_idx"}):Promise.resolve(),
      cycleStartVal?sb.from("profiles").update({cycle_start:cycleStartVal}).eq("id",user.id):Promise.resolve()
    ]).then(function(){
      LS.set("ls-migrated",true);setMigrating(false);setShowMigration(false);
      setHistData(null);loadHistory();
    });
  }

    if(!allEx)return h("div",{style:{textAlign:"center",padding:60,color:C.dim,fontSize:11,letterSpacing:2}},"LOADING CATALOG...");

    // Derive available filter options from live data
    var seenEq={};var availEquipment=[];
    allEx.forEach(function(e){if(e.equipment_primary&&!seenEq[e.equipment_primary]){seenEq[e.equipment_primary]=true;availEquipment.push(e.equipment_primary);}});
    availEquipment.sort();
    var seenMod={};var availModality=[];
    allEx.forEach(function(e){(e.training_modality||[]).forEach(function(m){if(!seenMod[m]){seenMod[m]=true;availModality.push(m);}});});
    availModality.sort();
    var seenPat={};var availPattern=[];
    allEx.forEach(function(e){if(e.movement_pattern_primary&&!seenPat[e.movement_pattern_primary]){seenPat[e.movement_pattern_primary]=true;availPattern.push(e.movement_pattern_primary);}});
    availPattern.sort();

    var allFilterCats=[
      {key:"muscle",    label:"Muscle Group", options:Object.keys(MUSCLE_TARGETS)},
      {key:"equipment", label:"Equipment",    options:availEquipment},
      {key:"modality",  label:"Modality",     options:availModality},
      {key:"pattern",   label:"Pattern",      options:availPattern},
      {key:"domain",    label:"Domain",       options:["lifting","martial_arts","conditioning","mobility"]}
    ];

    // Filter exercises (same AND logic as before)
    var filtered=allEx.filter(function(ex){
      if(catalogSearch){
        var q=catalogSearch.toLowerCase();
        if(ex.name.toLowerCase().indexOf(q)<0&&!(ex.aliases||[]).some(function(a){return a.toLowerCase().indexOf(q)>=0;}))return false;
      }
      if(catalogFilters.muscle.length>0){
        var exGroups=getMuscleGroupsForExercise(ex.muscles);
        if(!catalogFilters.muscle.some(function(m){return exGroups.indexOf(m)>=0;}))return false;
      }
      if(catalogFilters.equipment.length>0&&catalogFilters.equipment.indexOf(ex.equipment_primary)<0)return false;
      if(catalogFilters.modality.length>0&&!(ex.training_modality||[]).some(function(m){return catalogFilters.modality.indexOf(m)>=0;}))return false;
      if(catalogFilters.pattern.length>0&&catalogFilters.pattern.indexOf(ex.movement_pattern_primary)<0)return false;
      if(catalogFilters.domain.length<4&&catalogFilters.domain.indexOf(ex.domain)<0)return false;
      return true;
    });
    filtered.sort(function(a,b){return a.name<b.name?-1:1;});

    var activeFilterCount=0;
    if(catalogFilters.muscle.length>0)activeFilterCount++;
    if(catalogFilters.equipment.length>0)activeFilterCount++;
    if(catalogFilters.modality.length>0)activeFilterCount++;
    if(catalogFilters.pattern.length>0)activeFilterCount++;
    if(catalogFilters.domain.length<4)activeFilterCount++;
    var filtersActive=activeFilterCount>0||!!catalogSearch;
    var showClearAll=filtersActive;

    // Group assignment: exercise belongs to every MUSCLE_TARGETS group it hits at weight>=0.5.
    // Exercises with no qualifying muscle (e.g. empty-muscle conditioning drills) go to "Conditioning / Skill".
    // Group order = MUSCLE_TARGETS key order, then "Conditioning / Skill" at the end.
    var GROUP_NAMES=Object.keys(MUSCLE_TARGETS).concat(["Conditioning / Skill"]);
    var groupMap={};
    GROUP_NAMES.forEach(function(g){groupMap[g]=[];});
    filtered.forEach(function(ex){
      var gs=getMuscleGroupsForExercise(ex.muscles);
      if(gs.length===0){
        groupMap["Conditioning / Skill"].push(ex);
      } else {
        gs.forEach(function(g){if(groupMap[g])groupMap[g].push(ex);});
      }
    });

    // When filters/search are active, auto-expand all non-empty groups.
    // When inactive, use the user's manually set catalogGroupsOpen state.
    function isGroupOpen(g){
      if(filtersActive)return groupMap[g].length>0;
      return !!catalogGroupsOpen[g];
    }
    function toggleGroup(g){
      setCatalogGroupsOpen(function(p){var n=Object.assign({},p);n[g]=!p[g];return n;});
    }

    function isChipActive(key){
      return key==="domain"?catalogFilters.domain.length<4:catalogFilters[key].length>0;
    }
    function chipLabel(cat){
      if(cat.key==="domain")return catalogFilters.domain.length<4?"Domain ("+catalogFilters.domain.length+")":"Domain";
      var n=catalogFilters[cat.key].length;
      return n>0?(cat.label+" ("+n+")"):cat.label;
    }
    function toggleFilterVal(key,val){
      setCatalogFilters(function(prev){
        var arr=prev[key]||[];
        var newArr=arr.indexOf(val)>=0?arr.filter(function(v){return v!==val;}):arr.concat(val);
        var upd={};upd[key]=newArr;
        return Object.assign({},prev,upd);
      });
    }
    function clearAll(){
      setCatalogFilters({muscle:[],equipment:[],modality:[],pattern:[],domain:["lifting","martial_arts","conditioning","mobility"]});
      setCatalogSearch("");
    }

    // Inner exercise card — lighter background than the group row to create nesting feel
    function renderCard(ex){
      var isExp=!!catalogExpanded[ex.exercise_id];
      var eqIcon=EQUIP_ICON[ex.equipment_primary]||"•";
      var modTag=(ex.training_modality||[])[0]||"";
      var fi=FATIGUE_INFO[ex.default_role]||{label:"—",color:C.dim,explanation:"—"};
      var subCount=catalogSubCounts[ex.exercise_id]||0;
      var primaryMuscles=(ex.muscles||[]).filter(function(m){return m.weight>=0.5;});
      var hem=ex.head_emphasis_notes;
      var hemKeys=hem?Object.keys(hem):[];
      return h("div",{key:ex.exercise_id,id:"ex-"+ex.exercise_id,style:{background:C.bg,border:"1px solid "+C.border,borderRadius:6,padding:"10px 12px",marginBottom:6}},
        h("div",{onClick:function(){setCatalogExpanded(function(p){var n=Object.assign({},p);n[ex.exercise_id]=!p[ex.exercise_id];return n;});},style:{cursor:"pointer"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}},
            h("div",{style:{fontSize:12,fontWeight:600,color:C.white,flex:1,lineHeight:1.3,paddingRight:8}},ex.name),
            h("span",{style:{fontSize:10,color:C.dim,flexShrink:0,marginTop:1}},isExp?"▲":"▼")
          ),
          h("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
            h("span",{style:{fontSize:9,padding:"2px 6px",borderRadius:3,background:C.dark,color:C.grey}},eqIcon+" "+(ex.equipment_primary||"").replace(/_/g," ")),
            modTag?h("span",{style:{fontSize:9,padding:"2px 6px",borderRadius:3,background:C.dark,color:C.grey}},modTag.replace(/_/g," ")):null,
            h("span",{style:{fontSize:9,padding:"2px 6px",borderRadius:3,background:fi.color+"22",color:fi.color,fontWeight:600}},fi.label)
          )
        ),
        isExp?h("div",{style:{marginTop:10,borderTop:"1px solid "+C.border,paddingTop:8}},
          ex.aliases&&ex.aliases.length>0?h("div",{style:{fontSize:10,color:C.dim,marginBottom:8}},ex.aliases.join(", ")):null,
          primaryMuscles.length>0?h("div",{style:{marginBottom:8}},
            h("div",{style:{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:4}},"MUSCLES"),
            primaryMuscles.map(function(m,j){
              return h("div",{key:j,style:{fontSize:11,color:C.white,marginBottom:2}},
                muscleIdToLabel(m.muscle_id)+" "+(m.weight===1.0?"— primary":"— secondary"));
            })
          ):null,
          hemKeys.length>0?h("div",{style:{marginBottom:8}},
            h("div",{style:{fontSize:9,color:C.dim,letterSpacing:1,marginBottom:4}},"COACHING CUES"),
            hemKeys.map(function(k,j){
              return h("div",{key:j,style:{fontSize:11,color:C.white,marginBottom:2}},
                h("span",{style:{color:C.grey}},muscleIdToLabel(k)+": "),hem[k]
              );
            })
          ):null,
          h("div",{style:{fontSize:11,color:C.dim,marginBottom:4}},fi.explanation),
          subCount>0
            ?h("div",{onClick:function(e){e.stopPropagation();setSubSheet({exercise:ex,context:"catalog"});},style:{fontSize:11,color:C.accent,cursor:"pointer",textDecoration:"underline"}},
              subCount+" substitute"+(subCount===1?"":"s")+" available")
            :h("div",{style:{fontSize:11,color:C.dim}},"No substitutes")
        ):null
      );
    }

    // Group accordion row + its exercise cards
    function renderGroup(g){
      var exes=groupMap[g];
      if(exes.length===0)return null;
      var open=isGroupOpen(g);
      return h("div",{key:g,style:Object.assign({},S.card,{padding:"12px 14px",marginBottom:8})},
        h("div",{onClick:function(){toggleGroup(g);},style:{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",minHeight:20}},
          h("div",{style:{fontSize:13,fontWeight:700,color:C.white}},g),
          h("div",{style:{display:"flex",alignItems:"center",gap:8}},
            h("span",{style:{fontSize:11,color:C.dim}},exes.length),
            h("span",{style:{fontSize:10,color:C.dim}},open?"▲":"▼")
          )
        ),
        open?h("div",{style:{marginTop:10}},exes.map(renderCard)):null
      );
    }

    function renderSheet(){
      var cats=catalogSheet==="all"?allFilterCats:allFilterCats.filter(function(c){return c.key===catalogSheet;});
      return h("div",{style:{position:"fixed",inset:0,zIndex:200}},
        h("div",{onClick:function(){setCatalogSheet(null);},style:{position:"absolute",inset:0,background:"rgba(0,0,0,0.75)"}}),
        h("div",{style:{position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.card,borderTop:"2px solid "+C.border,borderRadius:"12px 12px 0 0",padding:"16px 16px 32px",maxHeight:"72vh",overflowY:"auto"}},
          cats.map(function(cat,ci){
            return h("div",{key:cat.key,style:{marginBottom:ci<cats.length-1?20:0}},
              h("div",{style:{fontSize:10,fontWeight:700,color:C.white,letterSpacing:2,marginBottom:8}},cat.label.toUpperCase()),
              cat.options.map(function(opt,oi){
                var checked=cat.key==="domain"
                  ?catalogFilters.domain.indexOf(opt)>=0
                  :(catalogFilters[cat.key]||[]).indexOf(opt)>=0;
                return h("div",{key:oi,onClick:function(){toggleFilterVal(cat.key,opt);},
                  style:{display:"flex",alignItems:"center",gap:10,padding:"10px 0",cursor:"pointer",borderBottom:"1px solid "+C.border,minHeight:44}},
                  h("div",{style:{width:18,height:18,border:"2px solid "+(checked?C.accent:C.dim),borderRadius:3,background:checked?C.accent:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}},
                    checked?h("span",{style:{fontSize:10,color:C.bg,fontWeight:700,lineHeight:1}},"✓"):null
                  ),
                  h("span",{style:{fontSize:12,color:C.white}},opt.replace(/_/g," "))
                );
              })
            );
          }),
          h("div",{onClick:function(){setCatalogSheet(null);},style:{marginTop:16,padding:"12px",background:C.accent,color:C.bg,fontWeight:700,fontSize:13,textAlign:"center",borderRadius:6,cursor:"pointer",letterSpacing:2}},"DONE")
        )
      );
    }

    return h("div",null,
      h("div",{style:S.header},
        h("div",{style:S.title},"Exercise Database"),
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginTop:4}},
          h("div",{style:S.h1},"Exercise Catalog"),
          h("div",{style:{fontSize:11,color:C.dim}},filtered.length+" exercises")
        )
      ),
      h("input",{type:"text",placeholder:"Search by name or alias…",value:catalogSearch,
        onChange:function(e){setCatalogSearch(e.target.value);},
        style:Object.assign({},S.input,{width:"100%",padding:"10px 12px",fontSize:13,marginBottom:10})}),
      h("div",{style:{marginBottom:12}},
        h("div",{"data-hscroll":"1",style:{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,alignItems:"center"}},
          activeFilterCount>=2
            ?h("div",{onClick:function(){setCatalogSheet("all");},style:{padding:"6px 10px",borderRadius:20,fontSize:10,fontWeight:700,color:C.bg,background:C.accent,border:"1px solid "+C.accent,cursor:"pointer",letterSpacing:1,whiteSpace:"nowrap",flexShrink:0}},"Filters ("+activeFilterCount+")")
            :allFilterCats.map(function(cat){
              var active=isChipActive(cat.key);
              return h("div",{key:cat.key,onClick:function(){setCatalogSheet(cat.key);},
                style:{padding:"6px 10px",borderRadius:20,fontSize:10,fontWeight:active?700:400,color:active?C.bg:C.grey,background:active?C.accent:"transparent",border:"1px solid "+(active?C.accent:C.border),cursor:"pointer",letterSpacing:1,whiteSpace:"nowrap",flexShrink:0}},
                chipLabel(cat));
            }),
          showClearAll?h("div",{onClick:clearAll,style:{padding:"6px 10px",fontSize:10,color:C.accent,cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}},"Clear all"):null
        )
      ),
      filtered.length===0
        ?h("div",{style:Object.assign({},S.card,{textAlign:"center",padding:32})},
          h("div",{style:{fontSize:24,marginBottom:8}},"🔍"),
          h("div",{style:{fontSize:13,color:C.white,marginBottom:12}},"No exercises match these filters"),
          h("div",{onClick:clearAll,style:{fontSize:12,color:C.accent,cursor:"pointer"}},"Clear filters")
        )
        :GROUP_NAMES.map(renderGroup),
      catalogSheet?renderSheet():null
    );
  }

      ),
      nutRefreshing?h("div",{style:{textAlign:"center",padding:"6px 0 2px",fontSize:10,color:C.dim,letterSpacing:1}},"↻  REFRESHING..."):null,
      h("div",{style:S.card},
        MacroBar("Protein",totals.protein,targets.protein,C.blue),
        MacroBar("Carbs",totals.carbs,targets.carbs,C.orange),
        MacroBar("Fat",totals.fat,targets.fat,C.yellow),
        MacroBar("Calories",totals.calories,targets.cal,C.accent)
      ),
      h("input",{type:"file",accept:"image/*",capture:"environment",style:{display:"none"},ref:cameraInputRef,
        onChange:function(e){
          var file=e.target.files[0];if(!file)return;
          var mode=nutScanModeRef.current;
          e.target.value="";
          var url=URL.createObjectURL(file);
          var img=new Image();
          img.onload=function(){
            URL.revokeObjectURL(url);
            var MAX=1024;var w=img.width;var h=img.height;
            if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
            var canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
            canvas.getContext("2d").drawImage(img,0,0,w,h);
            var b64=canvas.toDataURL("image/jpeg",0.85).split(",")[1];
            if(!profile||!profile.anthropic_api_key){setPendingScan({b64:b64,mode:mode});setApiKeyModal(true);}
            else callClaudeVision(b64,mode);
          };
          img.onerror=function(){URL.revokeObjectURL(url);toast("Could not load image. Try again.","error");};
          img.src=url;
        }
      }),
      h("div",{style:{display:"flex",gap:8,marginBottom:14}},
        h("div",{onClick:function(){nutScanModeRef.current="scan_label";if(cameraInputRef.current)cameraInputRef.current.click();},
          style:{flex:1,padding:"12px 0",background:C.card,border:"1px solid "+C.border,borderRadius:6,textAlign:"center",cursor:"pointer",fontSize:11,fontWeight:700,color:C.white}},"📷 SCAN LABEL"),
        h("div",{onClick:function(){nutScanModeRef.current="eyeball";if(cameraInputRef.current)cameraInputRef.current.click();},
          style:{flex:1,padding:"12px 0",background:C.card,border:"1px solid "+C.border,borderRadius:6,textAlign:"center",cursor:"pointer",fontSize:11,fontWeight:700,color:C.white}},"👁 EYEBALL"),
        h("div",{onClick:function(){setNutManual(true);},
          style:{flex:1,padding:"12px 0",background:C.card,border:"1px solid "+C.border,borderRadius:6,textAlign:"center",cursor:"pointer",fontSize:11,fontWeight:700,color:C.white}},"+ MANUAL")
      ),
      recentFoods.length>0?h("div",{style:{marginBottom:14}},
        h("div",{style:{fontSize:10,color:C.dim,letterSpacing:1,marginBottom:8}},"QUICK ADD"),
        h("div",{"data-hscroll":"1",style:{display:"flex",gap:8,overflowX:"auto",paddingBottom:4,scrollbarWidth:"none",msOverflowStyle:"none"}},
          recentFoods.map(function(food,i){
            return h("div",{key:i,onClick:function(){
              setNutScan({mode:"manual",result:{name:food.name,calories:food.calories,protein:food.protein,carbs:food.carbs,fat:food.fat},portionMult:1.0,base64:null});
            },style:{flexShrink:0,background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:"8px 10px",cursor:"pointer",minWidth:80,maxWidth:130}},
              h("div",{style:{fontSize:10,fontWeight:700,color:C.white,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},food.name),
              h("div",{style:{fontSize:9,color:C.dim,marginTop:3}},Math.round(food.calories)+"kcal · "+Math.round(food.protein)+"g P")
            );
          })
        )
      ):null,
      h("div",{style:{fontSize:10,color:C.dim,letterSpacing:1,marginBottom:8}},"TODAY'S FOOD"),
      nutLog.length===0?h("div",{style:Object.assign({},S.card,{textAlign:"center",color:C.dim,padding:24,fontSize:12})},
        h("div",null,"No food logged for "+fmtDate(dt)),
        h("div",{style:{fontSize:10,marginTop:6,color:C.dark}},nutRefreshing?"Checking...":"Pull down or tap ↻ to refresh")
      ):
      nutLog.slice().reverse().map(function(row,i){
        var srcBadge={scan_label:"📷",eyeball:"👁",manual:"✏️"};
        var cal=Math.round(row.calories*row.portion_multiplier);
        var prot=(row.protein*row.portion_multiplier).toFixed(1);
        var rowId=row.id;
        return h("div",{key:rowId||i,style:Object.assign({},S.card,{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px"})},
          h("div",{style:{flex:1}},
            h("div",{style:{fontSize:12,fontWeight:600,color:C.white}},(srcBadge[row.source]||"")+" "+row.name),
            h("div",{style:{fontSize:10,color:C.dim,marginTop:2}},cal+"kcal · "+prot+"g protein"+(row.portion_multiplier!==1?" · "+row.portion_multiplier+"×":""))
          ),
          h("div",{onClick:function(){
            setNutLog(function(p){return p.filter(function(x){return x.id!==rowId;});});
            sb.from("nutrition_logs").delete().eq("id",rowId).then(function(r){
              if(r.error)setNutLog(function(p){return p.concat(row);});
            });
          },style:{color:C.dim,cursor:"pointer",fontSize:18,padding:"4px 8px",flexShrink:0}},"×")
        );
      })
    );
  }

  if(authState==="loading")return h("div",{style:{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:C.bg,color:C.dim,fontSize:10,letterSpacing:4}},"LOADING...");
  if(authState==="unauthed")return h(AuthScreen);
  if(authState==="onboarding")return h(OnboardingWizard,{user:user,onComplete:function(p){setProfile(p);setAuthState("authed");}});

  var tabs=[{id:"dashboard",icon:"📋",l:"Today"},{id:"workout",icon:"🏋️",l:"Workout"},{id:"plan",icon:"🗂️",l:"Plan"},{id:"history",icon:"📊",l:"History"},{id:"nutrition",icon:"🍽️",l:"Nutrition"},{id:"sections",icon:"◆",l:"Systems"}];

  return h("div",{style:{background:C.bg,minHeight:"100vh"},onTouchStart:handleTouchStart,onTouchMove:handleTouchMove,onTouchEnd:handleTouchEnd},
    h("div",{style:{position:"fixed",bottom:70,left:"50%",transform:"translateX(-50%)",width:"calc(100% - 32px)",maxWidth:448,zIndex:9999,display:"flex",flexDirection:"column",alignItems:"center",gap:8,pointerEvents:"none"}},
      toasts.map(function(t){
        return h("div",{key:t.id,style:{background:t.type==="error"?C.red:C.green,color:"#000",padding:"10px 18px",borderRadius:6,fontSize:12,fontWeight:700,letterSpacing:0.5,textAlign:"center",width:"100%",fontFamily:"'Courier New',monospace"}},t.msg);
      })
    ),
    h("div",{style:S.wrap},
      h("div",{key:"v-"+view,className:"fade-in"},
        view==="dashboard"?Dashboard():
        view==="workout"?WorkoutView():
        view==="plan"?PlanView():
        view==="history"?HistoryView():
        view==="nutrition"?NutritionView():
        view==="sections"?SystemsView():null
      )
    ),
    timer?h("div",{style:{position:"fixed",bottom:56,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.card,borderTop:"2px solid "+timerClr,padding:"10px 14px",zIndex:99,display:"flex",alignItems:"center",gap:10}},
      h("div",{style:{flex:1}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}},
          h("div",{style:{fontSize:9,color:C.dim,letterSpacing:1,textTransform:"uppercase",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}},timer.label||"REST"),
          h("div",{style:{fontSize:20,fontWeight:700,color:timerClr,fontVariantNumeric:"tabular-nums",letterSpacing:2}},timer.done?"DONE ✓":fmtTimer(timer.remaining))
        ),
        h("div",{style:{height:3,background:C.dark,borderRadius:2}},
          h("div",{style:{height:3,background:timerClr,borderRadius:2,width:(timer.done?100:Math.round((timer.remaining/timer.total)*100))+"%",transition:"width 1s linear"}})
        )
      ),
      h("div",{style:{display:"flex",gap:5,flexShrink:0}},
        !timer.done&&h("div",{onClick:function(){setTimer(function(t){return t?{remaining:Math.max(10,t.remaining-30),total:t.total,label:t.label,active:t.active,done:t.done}:t;});},style:{fontSize:10,color:C.dim,padding:"5px 7px",border:"1px solid "+C.border,borderRadius:4,cursor:"pointer"}},"−30"),
        !timer.done&&h("div",{onClick:function(){setTimer(function(t){return t?{remaining:t.remaining+30,total:t.total,label:t.label,active:t.active,done:t.done}:t;});},style:{fontSize:10,color:C.dim,padding:"5px 7px",border:"1px solid "+C.border,borderRadius:4,cursor:"pointer"}},"+30"),
        h("div",{onClick:function(){setTimer(null);},style:{fontSize:10,color:C.bg,padding:"5px 9px",background:timer.done?C.accent:C.dark,borderRadius:4,cursor:"pointer",fontWeight:700}},timer.done?"CLOSE":"SKIP")
      )
    ):null,
    showMigration?h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}},
      h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24,maxWidth:400,width:"100%"}},
        h("div",{style:{fontSize:14,fontWeight:700,color:C.white,marginBottom:8}},"Import existing data?"),
        h("div",{style:{fontSize:12,color:C.dim,marginBottom:20,lineHeight:1.6}},"We found workout and checklist data stored locally on this device. Import it to your account so it syncs everywhere?"),
        h("div",{style:{display:"flex",gap:8}},
          h("div",{onClick:migrating?null:doMigration,style:{flex:1,padding:"12px",background:C.green,color:C.bg,fontWeight:700,fontSize:13,textAlign:"center",borderRadius:6,cursor:migrating?"wait":"pointer",opacity:migrating?0.7:1}},migrating?"IMPORTING...":"IMPORT DATA"),
          h("div",{onClick:function(){LS.set("ls-migrated",true);setShowMigration(false);},style:{padding:"12px 16px",border:"1px solid "+C.border,color:C.dim,fontSize:13,textAlign:"center",borderRadius:6,cursor:"pointer"}},"SKIP")
        )
      )
    ):null,
    apiKeyModal?h("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.9)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:20}},
      h("div",{style:{background:C.card,border:"1px solid "+C.border,borderRadius:12,padding:24,maxWidth:400,width:"100%"}},
        h("div",{style:{fontSize:14,fontWeight:700,color:C.white,marginBottom:4}},
          profile&&profile.anthropic_api_key?"Update API Key":"Anthropic API Key Required"),
        h("div",{style:{fontSize:11,color:C.dim,marginBottom:14,lineHeight:1.6}},
          "Enter your key at console.anthropic.com → API keys. Saves to your account and syncs across all devices."),
        h("div",{style:{position:"relative",marginBottom:apiKeyError?8:14}},
          h("input",{type:apiKeyVisible?"text":"password",placeholder:"sk-ant-...",value:apiKeyInput,
            onChange:function(e){setApiKeyInput(e.target.value);setApiKeyError(null);},
            onKeyDown:function(e){if(e.key==="Enter")saveApiKey();},
            style:Object.assign({},S.input,{width:"100%",padding:"10px",paddingRight:64,fontSize:13})}),
          h("span",{onClick:function(){setApiKeyVisible(function(v){return !v;});},
            style:{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.dim,fontSize:10,cursor:"pointer",letterSpacing:1,userSelect:"none"}},
            apiKeyVisible?"HIDE":"SHOW")
        ),
        apiKeyError?h("div",{style:{fontSize:11,color:"#ef4444",marginBottom:12,letterSpacing:0.3}},apiKeyError):null,
        h("div",{style:{display:"flex",gap:8}},
          h("div",{onClick:saveApiKey,style:{flex:1,padding:"12px",background:C.green,color:C.bg,fontWeight:700,fontSize:13,textAlign:"center",borderRadius:6,cursor:"pointer"}},"SAVE"),
          h("div",{onClick:function(){setApiKeyModal(false);setApiKeyInput("");setApiKeyError(null);setApiKeyVisible(false);setPendingScan(null);},style:{padding:"12px 16px",border:"1px solid "+C.border,color:C.dim,fontSize:13,textAlign:"center",borderRadius:6,cursor:"pointer"}},"CANCEL")
        )
      )
    ):null,
    swapToast?h("div",{style:{position:"fixed",bottom:70,left:"50%",transform:"translateX(-50%)",width:"calc(100% - 32px)",maxWidth:448,zIndex:9998,pointerEvents:"auto"}},
      h("div",{style:{background:"#0e1a2e",border:"1px solid "+C.blue+"88",color:C.white,padding:"10px 14px",borderRadius:6,fontSize:12,fontFamily:"'Courier New',monospace",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}},
        h("span",{style:{flex:1}},swapToast.originalName+" → "+swapToast.newName),
        h("span",{onClick:undoSwap,style:{color:C.accent,fontWeight:700,cursor:"pointer",flexShrink:0,padding:"2px 8px",border:"1px solid "+C.accent+"44",borderRadius:3,letterSpacing:1,fontSize:11}},"UNDO")
      )
    ):null,
    subSheet?h(SubstituteSheet,{
      exercise:subSheet.exercise,
      context:subSheet.context,
      onClose:function(){setSubSheet(null);},
      onSelect:(function(sh){
        if(sh.context==="catalog"){
          return function(subEx){
            setSubSheet(null);
            setCatalogExpanded(function(p){var n=Object.assign({},p);n[subEx.exercise_id]=true;return n;});
            var groups=getMuscleGroupsForExercise(subEx.muscles);
            var groupsToOpen=groups.length>0?groups:["Conditioning / Skill"];
            setCatalogGroupsOpen(function(p){var n=Object.assign({},p);groupsToOpen.forEach(function(g){n[g]=true;});return n;});
            setTimeout(function(){var el=document.getElementById("ex-"+subEx.exercise_id);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},150);
          };
        } else {
          return function(subEx){
            var origId=sh.workoutOriginalId||sh.exercise.exercise_id;
            var displayedName=sh.exercise.name;
            setSubSheet(null);
            doSwap(origId,subEx.exercise_id,displayedName,subEx.name);
          };
        }
      })(subSheet)
    }):null,
    h("div",{style:S.nav},
      tabs.map(function(tab){
        return h("div",{key:tab.id,onClick:function(){setView(tab.id);if(tab.id==="workout")setViewDate(getToday());if(tab.id!=="sections")setSection(null);},style:{display:"flex",flexDirection:"column",alignItems:"center",gap:2,cursor:"pointer",padding:"4px 8px",border:"none",background:"none"}},
          h("span",{style:{fontSize:16}},tab.icon),
          h("span",{style:{fontSize:9,letterSpacing:1,color:view===tab.id?C.accent:C.dim,fontWeight:view===tab.id?700:400}},tab.l)
        );
      })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
